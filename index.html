<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 A Little Question...</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<style>
  :root {
    --pink: #ff6b9d;
    --deep: #c9184a;
    --soft: #ffd6e7;
    --cream: #fff0f6;
    --ink: #ffe9f2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    background: #ffe4ee;
    font-family: 'Lato', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    color: #8a2440;
  }

  /* ===== LIVE VIDEO BACKGROUND ===== */
  #bg-video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    animation: slowZoom 36s ease-in-out infinite alternate;
  }
  @keyframes slowZoom {
    from { transform: scale(1); }
    to { transform: scale(1.09); }
  }

  /* Cinematic color grade over the video */
  .grade {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(255,255,255,0.25) 0%, transparent 60%),
      linear-gradient(180deg, rgba(255,240,246,0.5) 0%, rgba(255,240,246,0.18) 40%, rgba(255,228,238,0.45) 100%);
  }

  /* Vignette */
  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(255,182,205,0.4) 100%);
  }

  /* Floating hearts + sparkles */
  .hearts-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  .bg-heart {
    position: absolute;
    font-size: 1.2rem;
    opacity: 0.35;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,107,157,0.7));
  }

  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    12% { opacity: 0.4; }
    50% { opacity: 0.35; }
    88% { opacity: 0.25; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  .sparkle {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px 2px rgba(255,214,231,0.9);
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; transform: scale(0.4); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Main card — midnight glass */
  .card {
    position: relative;
    z-index: 10;
    background: linear-gradient(135deg, rgba(255,240,246,0.42), rgba(255,228,238,0.32));
    backdrop-filter: blur(30px) saturate(1.6);
    -webkit-backdrop-filter: blur(30px) saturate(1.6);
    border-radius: 32px;
    padding: 52px 44px 44px;
    max-width: 480px;
    width: 92vw;
    text-align: center;
    box-shadow:
      0 30px 80px rgba(201,24,74,0.18),
      0 0 70px rgba(255,182,205,0.35),
      inset 0 1px 0 rgba(255,255,255,0.55);
    border: 1.5px solid rgba(255,255,255,0.55);
  }

  .card::before {
    content: '';
    position: absolute;
    inset: -1.5px;
    border-radius: 33px;
    padding: 1.5px;
    background: linear-gradient(135deg, rgba(255,107,157,0.7), transparent 30%, transparent 70%, rgba(255,182,213,0.6));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* Watermark */
  .watermark {
    position: fixed;
    bottom: 16px;
    right: 20px;
    z-index: 999;
    font-family: 'Playfair Display', serif;
    font-size: 0.75rem;
    color: rgba(160,40,90,0.6);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 4px;
    user-select: none;
    text-shadow: 0 1px 6px rgba(255,255,255,0.7);
  }
  .watermark span { font-weight: 700; color: rgba(160,40,90,0.85); }

  /* Music toggle */
  #music-toggle {
    position: fixed;
    bottom: 14px;
    left: 16px;
    z-index: 999;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(10px);
    color: var(--deep);
    font-size: 1.15rem;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
  }
  #music-toggle:hover { transform: scale(1.1); box-shadow: 0 4px 22px rgba(255,107,157,0.4); }

  /* Top live stats — visits + love reactions */
  #top-stats {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 998;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #visit-pill, #love-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    background: linear-gradient(135deg, rgba(255,255,255,0.65), rgba(255,228,238,0.5));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 50px;
    padding: 8px 16px;
    font-size: 0.82rem;
    font-weight: 400;
    color: #b03060;
    letter-spacing: 0.08em;
    box-shadow: 0 8px 24px rgba(201,24,74,0.16), 0 0 18px rgba(255,182,205,0.35);
    user-select: none;
    white-space: nowrap;
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }
  #love-pill { cursor: pointer; }
  #love-pill:active { transform: scale(0.94); }
  #love-pill .pill-heart {
    display: inline-block;
    animation: pillBeat 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255,107,157,0.7));
  }
  #visit-pill .pill-bloom {
    display: inline-block;
    filter: drop-shadow(0 0 6px rgba(255,182,205,0.7));
  }
  .dots { animation: dotPulse 1s ease-in-out infinite; }
  @keyframes dotPulse {
    0%,100% { opacity: 0.35; }
    50% { opacity: 1; }
  }
  /* Tap hint bubble — prothom dekha porjonto */
  #love-hint {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    background: rgba(255,255,255,0.92);
    color: #c2185b;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 7px 14px;
    border-radius: 20px;
    white-space: nowrap;
    box-shadow: 0 6px 18px rgba(201,24,74,0.25);
    border: 1px solid rgba(255,255,255,0.9);
    animation: hintFloat 2s ease-in-out infinite;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #love-hint::after {
    content: '';
    position: absolute;
    bottom: 100%;
    right: 30px;
    border: 7px solid transparent;
    border-bottom-color: rgba(255,255,255,0.92);
  }
  #love-hint.hide { opacity: 0; }
  @keyframes hintFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  /* Inviting glow jotokkhon keu react na kore */
  #love-pill.invite { animation: inviteGlow 2.2s ease-in-out infinite; }
  @keyframes inviteGlow {
    0%,100% { box-shadow: 0 8px 24px rgba(201,24,74,0.16), 0 0 18px rgba(255,182,205,0.35); }
    50% { box-shadow: 0 8px 24px rgba(201,24,74,0.30), 0 0 34px rgba(255,107,157,0.7); }
  }
  @keyframes pillBeat {
    0%,100% { transform: scale(1); }
    12% { transform: scale(1.25); }
    24% { transform: scale(1); }
  }
  #visit-pill.pop, #love-pill.pop { animation: statPop 0.5s ease; }
  @keyframes statPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  .mini-heart {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    animation: heartFloat 1.2s ease-out forwards;
    font-size: 1rem;
  }
  @keyframes heartFloat {
    0% { opacity: 1; transform: translateY(0) scale(0.6); }
    100% { opacity: 0; transform: translateY(-70px) scale(1.35); }
  }

  /* Start screen */
  #start-screen { display: flex; flex-direction: column; align-items: center; gap: 20px; }

  .big-heart {
    font-size: 5rem;
    animation: heartBeat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 4px 24px rgba(255,107,157,0.8));
  }

  @keyframes heartBeat {
    0%,100% { transform: scale(1); }
    14% { transform: scale(1.15); }
    28% { transform: scale(1); }
    42% { transform: scale(1.1); }
    70% { transform: scale(1); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: 2.1rem;
    line-height: 1.25;
    background: linear-gradient(100deg, #c9184a, #ff5c8a, #e5387c, #ff5c8a, #c9184a);
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite;
    filter: drop-shadow(0 2px 10px rgba(255,107,157,0.3));
  }
  @keyframes shimmer {
    to { background-position: 250% center; }
  }

  .subtitle {
    font-size: 0.95rem;
    color: #a0496a;
    font-weight: 300;
    letter-spacing: 0.06em;
  }

  .btn-start {
    margin-top: 8px;
    background: linear-gradient(135deg, var(--pink), var(--deep));
    color: white;
    border: none;
    padding: 16px 52px;
    border-radius: 50px;
    font-size: 1.05rem;
    font-family: 'Playfair Display', serif;
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(255,107,157,0.45), 0 0 0 1px rgba(255,255,255,0.15) inset;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-start::after {
    content: '';
    position: absolute;
    top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    animation: btnShine 3.2s ease-in-out infinite;
  }
  @keyframes btnShine {
    0%, 60% { left: -80%; }
    100% { left: 160%; }
  }
  .btn-start:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 14px 44px rgba(255,107,157,0.6);
  }
  .btn-start:active { transform: scale(0.97); }

  /* Question screen */
  #question-screen { display: none; flex-direction: column; align-items: center; gap: 28px; }

  .progress-wrap {
    width: 100%;
    background: rgba(255,107,157,0.15);
    border-radius: 50px;
    height: 8px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), #ff8fb5, var(--deep));
    border-radius: 50px;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 12px rgba(255,107,157,0.8);
  }

  .step-label {
    font-size: 0.78rem;
    color: #c47a8f;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .question-emoji {
    width: 130px;
    height: 130px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 10px 34px rgba(0,0,0,0.5),
      0 0 28px rgba(255,107,157,0.35),
      inset 0 1px 0 rgba(255,255,255,0.25);
    border: 3px solid rgba(255,255,255,0.3);
    animation: pop 0.4s cubic-bezier(.4,0,.2,1);
  }

  .question-emoji img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: #7d1030;
    line-height: 1.45;
    font-style: italic;
    animation: fadeSlide 0.45s ease;
    text-shadow: 0 2px 18px rgba(255,107,157,0.4);
  }

  @keyframes fadeSlide {
    0% { opacity: 0; transform: translateY(18px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .btn-row {
    display: flex;
    gap: 16px;
    margin-top: 4px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-yes {
    background: linear-gradient(135deg, #ff6b9d, #c9184a);
    color: white;
    border: none;
    padding: 15px 44px;
    border-radius: 50px;
    font-size: 1rem;
    font-family: 'Playfair Display', serif;
    cursor: pointer;
    box-shadow: 0 6px 26px rgba(255,107,157,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.04em;
  }
  .btn-yes:hover { transform: scale(1.07); box-shadow: 0 10px 36px rgba(255,107,157,0.65); }
  .btn-yes:active { transform: scale(0.96); }

  .btn-no {
    background: rgba(255,107,157,0.1);
    color: var(--deep);
    border: 2px solid rgba(255,107,157,0.45);
    padding: 13px 36px;
    border-radius: 50px;
    font-size: 1rem;
    font-family: 'Playfair Display', serif;
    cursor: pointer;
    transition: left 0.18s ease, top 0.18s ease, transform 0.15s ease;
    letter-spacing: 0.04em;
    position: relative;
    z-index: 50;
    backdrop-filter: blur(6px);
  }
  .btn-no.roaming {
    position: absolute;
    z-index: 1000;
  }

  /* Final screen — cinematic staged reveal */
  #final-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  #final-screen > *:not(.grand-love):not(.forever-seal) { opacity: 0; }
  #final-screen.play > *:not(.grand-love):not(.forever-seal) { animation: riseIn 0.9s cubic-bezier(.22,1.15,.36,1) forwards; }
  #final-screen.play .burst-container { animation-delay: 0.1s; }
  #final-screen.play .final-title { animation: riseIn 0.9s cubic-bezier(.22,1.15,.36,1) 0.5s forwards, shimmer 5s linear infinite; }
  #final-screen.play .final-gif-wrap { animation-delay: 0.95s; }
  #final-screen.play .love-letter-wrap { animation-delay: 1.35s; }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(36px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .burst-container {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .final-heart {
    font-size: 4.5rem;
    animation: heartBeat 1.2s ease-in-out infinite;
    filter: drop-shadow(0 6px 28px rgba(255,107,157,0.9));
    z-index: 2;
    position: relative;
  }

  .orbit-heart {
    position: absolute;
    font-size: 1.2rem;
    animation: orbit linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,107,157,0.8));
  }

  @keyframes orbit {
    from { transform: rotate(var(--start)) translateX(50px) rotate(calc(-1 * var(--start))); }
    to { transform: rotate(calc(var(--start) + 360deg)) translateX(50px) rotate(calc(-1 * (var(--start) + 360deg))); }
  }

  .final-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.1rem;
    line-height: 1.3;
    background: linear-gradient(100deg, #c9184a, #ff5c8a, #e5387c, #ff5c8a, #c9184a);
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite;
  }

  /* Typewriter love letter */
  .love-letter-wrap {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.65);
    border-radius: 20px;
    padding: 20px 22px;
    box-shadow: 0 10px 30px rgba(201,24,74,0.14), inset 0 1px 0 rgba(255,255,255,0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .love-letter {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.02rem;
    color: #96304f;
    line-height: 1.75;
    margin: 0;
    min-height: 2.2em;
    text-align: center;
  }
  .type-cursor {
    display: inline-block;
    color: #ff5c8a;
    font-style: normal;
    animation: blink 0.8s steps(1) infinite;
    margin-left: 2px;
  }
  @keyframes blink { 0%,60% { opacity: 1; } 61%,100% { opacity: 0; } }

  /* Letter signature — vitorei, ashol chithir moto */
  .letter-sign {
    margin: 16px 4px 0 0;
    text-align: right;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.98rem;
    color: #c2185b;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .letter-sign.show {
    opacity: 1;
    transform: none;
    text-shadow: 0 0 14px rgba(255,107,157,0.55);
  }

  /* Heartbeat ripple rings */
  .ripple {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 84px;
    height: 84px;
    margin: -42px 0 0 -42px;
    border: 2px solid rgba(255,107,157,0.55);
    border-radius: 50%;
    animation: rippleGo 2.6s ease-out infinite;
    pointer-events: none;
  }
  .ripple.r2 { animation-delay: 1.3s; }
  @keyframes rippleGo {
    0% { transform: scale(0.55); opacity: 0.9; }
    100% { transform: scale(2.1); opacity: 0; }
  }

  /* Grand "I LOVE YOU" — letter by letter 3D pop */
  .grand-love {
    opacity: 0;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 2.4rem;
    letter-spacing: 0.06em;
    text-align: center;
    line-height: 1.2;
  }
  .grand-love.show { opacity: 1; }
  .gl-letter {
    display: inline-block;
    opacity: 0;
    background: linear-gradient(100deg, #c9184a, #ff5c8a, #ff8fab, #c9184a);
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .grand-love.show .gl-letter { animation: letterPop 0.7s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes letterPop {
    0% { opacity: 0; transform: scale(0.2) rotateX(90deg); }
    60% { opacity: 1; transform: scale(1.25) rotateX(0deg); }
    100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 14px rgba(255,92,138,0.8)); }
  }

  /* Forever seal */
  .forever-seal {
    opacity: 0;
    transform: scale(0.8);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.05rem;
    letter-spacing: 0.05em;
    color: #fff;
    background: linear-gradient(135deg, #ff5c8a, #c9184a);
    padding: 13px 32px;
    border-radius: 50px;
    box-shadow: 0 10px 30px rgba(201,24,74,0.4);
    white-space: nowrap;
  }
  .forever-seal.show { animation: sealIn 1s cubic-bezier(.2,1.3,.4,1) forwards, sealPulse 2.4s ease-in-out 1.2s infinite; }
  @keyframes sealIn {
    from { opacity: 0; transform: scale(0.6); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes sealPulse {
    0%,100% { box-shadow: 0 10px 30px rgba(201,24,74,0.4), 0 0 20px rgba(255,92,138,0.5); }
    50% { box-shadow: 0 10px 34px rgba(201,24,74,0.55), 0 0 46px rgba(255,92,138,0.85); }
  }

  /* Rising hearts — niche theke vashe uthbe */
  .rise-heart {
    position: fixed;
    bottom: -50px;
    z-index: 998;
    pointer-events: none;
    opacity: 0;
    animation: riseUp linear forwards;
    filter: drop-shadow(0 0 6px rgba(255,107,157,0.7));
  }
  @keyframes riseUp {
    0% { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
    10% { opacity: 0.9; }
    50% { transform: translateY(-55vh) translateX(24px) scale(1); }
    100% { transform: translateY(-112vh) translateX(-18px) scale(1.1); opacity: 0; }
  }

  /* Sakura petals — aste aste jhore porbe */
  .petal {
    position: fixed;
    top: -20px;
    z-index: 997;
    pointer-events: none;
    background: linear-gradient(135deg, #ffc2d4, #ff8fab);
    border-radius: 80% 0 80% 0;
    opacity: 0;
    animation: petalFall linear forwards;
  }
  @keyframes petalFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.85; }
    50% { transform: translateY(55vh) translateX(40px) rotate(200deg); }
    100% { transform: translateY(112vh) translateX(-30px) rotate(380deg); opacity: 0; }
  }

  .final-gif-wrap {
    width: 160px;
    height: 160px;

  // Per-question shuffle — ek question-e same request repeat hobe na
  let reqQ = -1, reqOrder = [], reqPtr = 0;
  function shuffledIdx(n) {
    const a = [];
    for (let i = 0; i < n; i++) a.push(i);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function showNoMessage() {
    const toast = document.getElementById('no-msg-toast');
    const textEl = document.getElementById('no-msg-text');
    const gifEl = document.getElementById('no-msg-gif');

    const pool = questionRequests[current] || questionRequests[0];
    if (reqQ !== current || reqPtr >= reqOrder.length) {
      reqQ = current;
      reqOrder = shuffledIdx(pool.length);
      reqPtr = 0;
    }
    const pair = pool[reqOrder[reqPtr++]];

    toast.classList.remove('show');
    void toast.offsetWidth;
    gifEl.src = pair.g;
    textEl.textContent = pair.t;
    toast.classList.add('show');
  }

  let dodgeCount = 0;
  function dodgeNo() {
    dodgeCount++;
    showNoMessage();
    const btn = document.getElementById('btn-no');
    const yesBtn = document.querySelector('.btn-yes');
    const card = document.querySelector('.card');

    const btnW = btn.offsetWidth || 110;
    const btnH = btn.offsetHeight || 46;
    const padding = 14;
    const buffer = 20;

    const cardW = card.clientWidth;
    const cardH = card.clientHeight;

    const minLeft = padding;
    const maxLeft = cardW - btnW - padding;
    const minTop = padding;
    const maxTop = cardH - btnH - padding;

    const yesLeft = yesBtn.offsetLeft;
    const yesTop = yesBtn.offsetTop;
    const yesRight = yesLeft + yesBtn.offsetWidth;
    const yesBottom = yesTop + yesBtn.offsetHeight;

    let newLeft, newTop, tries = 0;
    do {
      newLeft = minLeft + Math.random() * Math.max(0, maxLeft - minLeft);
      newTop = minTop + Math.random() * Math.max(0, maxTop - minTop);
      tries++;
    } while (
      tries < 15 &&
      newLeft < yesRight + buffer &&
      newLeft + btnW > yesLeft - buffer &&
      newTop < yesBottom + buffer &&
      newTop + btnH > yesTop - buffer
    );

    btn.classList.add('roaming');
    btn.style.left = newLeft + 'px';
    btn.style.top = newTop + 'px';
  }

  const finalGifs = [
    "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUycHN4czlqa2oxbGpxYWpnM2Fud2w0NWY2eWY4a292c3phaDB1cGd3ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/A8ReUjJdMCNOM/giphy.gif",
    "https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyN2VncXFiaWZ1cHF2bGtyb2JuNTBhZjJsdW1lc3F0aDNxdTJyNTFjbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/85NbGstFaElEO1Wusd/giphy.gif"
  ];

  // 💌 The love letter — types out live like he's writing to her
  const loveLetterText = `My love,

From the second you said YES, my whole world started glowing. 🌸

Ten questions… and you answered every single one with your heart. Each YES pulled me a little closer to you.

I promise — I will keep finding reasons for your smile, hold your hand through every storm, and love you a little more every single day.

You are my favourite hello, my sweetest dream, and my forever. 💖`;

  function typeLetter() {
    const el = document.getElementById('love-letter-text');
    const cursor = document.getElementById('type-cursor');
    el.innerHTML = '';
    cursor.style.display = '';
    document.getElementById('letter-sign').classList.remove('show');
    const chars = Array.from(loveLetterText);
    let i = 0;
    const timer = setInterval(() => {
      if (i >= chars.length) {
        clearInterval(timer);
        cursor.style.display = 'none';
        document.getElementById('letter-sign').classList.add('show');
        setTimeout(showGrandLove, 1100);
        return;
      }
      const ch = chars[i];
      el.innerHTML += (ch === '\n' ? '<br>' : ch);
      i++;
    }, 34);
  }

  // Grand "I LOVE YOU" — okkhor gulo ekta ekta kore 3D pop
  function showGrandLove() {
    const gl = document.getElementById('grand-love');
    gl.innerHTML = '';
    gl.classList.remove('show');
    const word = 'I LOVE YOU';
    Array.from(word).forEach((ch, idx) => {
      const s = document.createElement('span');
      s.className = 'gl-letter';
      s.textContent = (ch === ' ') ? ' ' : ch;
      s.style.animationDelay = (idx * 0.09) + 's';
      gl.appendChild(s);
    });
    void gl.offsetWidth;
    gl.classList.add('show');
    setTimeout(() => document.getElementById('forever-seal').classList.add('show'), word.length * 90 + 1000);
  }

  // Niche theke heart vashe uthbe
  function spawnRiseHeart() {
    const el = document.createElement('div');
    el.className = 'rise-heart';
    el.textContent = ['💗', '💖', '💕', '🌸', '✨'][Math.floor(Math.random() * 5)];
    el.style.left = (5 + Math.random() * 90) + 'vw';
    el.style.fontSize = (0.8 + Math.random() * 0.9) + 'rem';
    el.style.animationDuration = (4 + Math.random() * 3) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 7500);
  }

  // Sakura papri jhorbe
  function spawnPetal() {
    const el = document.createElement('div');
    el.className = 'petal';
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.animationDuration = (5 + Math.random() * 4) + 's';
    const s = 10 + Math.random() * 10;
    el.style.width = s + 'px';
    el.style.height = s + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 9500);
  }

  // Big radial heart burst from screen center
  function heartBurst(cx, cy, count, big) {
    const icons = ['💖', '💗', '💕', '🌸', '✨', '💓'];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'burst-heart';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      const ang = (i / count) * Math.PI * 2 + Math.random() * 0.4;
      const dist = (big ? 130 : 70) + Math.random() * (big ? 170 : 90);
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.fontSize = big ? (1.2 + Math.random() * 1.2) + 'rem' : (0.9 + Math.random() * 0.7) + 'rem';
      el.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }
  }

  function finaleBurst() {
    const flash = document.getElementById('flash');
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');
    heartBurst(window.innerWidth / 2, window.innerHeight * 0.35, 22, true);
  }

  function showFinal() {
    document.getElementById('question-screen').style.display = 'none';
    const fs = document.getElementById('final-screen');
    fs.style.display = 'flex';
    fs.classList.remove('play');
    void fs.offsetWidth;
    fs.classList.add('play');

    const gIdx = Math.floor(Math.random() * finalGifs.length);
    document.getElementById('final-gif').src = finalGifs[gIdx];

    // Surprise moment: flash + heart explosion
    setTimeout(finaleBurst, 250);

    // Opening confetti rain
    for (let i = 0; i < 30; i++) {
      setTimeout(() => spawnConfetti(true), i * 80);
    }
    // Celebration keeps going — confetti + mini fireworks
    let rounds = 0;
    const party = setInterval(() => {
      spawnConfetti(true);
      spawnConfetti(true);
      if (rounds % 4 === 1) {
        heartBurst(
          window.innerWidth * (0.2 + Math.random() * 0.6),
          window.innerHeight * (0.15 + Math.random() * 0.25),
          8, false
        );
      }
      if (++rounds > 26) clearInterval(party);
    }, 900);
    // Romantic ambience — vasoman heart + jhora papri
    const ambient = setInterval(() => {
      spawnRiseHeart();
      if (Math.random() < 0.6) spawnPetal();
    }, 700);
    setTimeout(() => clearInterval(ambient), 32000);

    // Grand finale elements reset (replay-safe)
    document.getElementById('grand-love').classList.remove('show');
    document.getElementById('forever-seal').classList.remove('show');

    // The letter starts typing once the stage is set
    setTimeout(typeLetter, 1700);
    document.getElementById('progress-bar').style.width = '100%';
  }

  function spawnConfetti(big = false) {
    const emojis = ['💗','💕','💖','💝','🌸','✨','💓','🥰'];
    const el = document.createElement('div');
    el.className = 'confetti-heart';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (10 + Math.random() * 80) + 'vw';
    el.style.top = '0';
    el.style.fontSize = big ? (1.5 + Math.random() * 1.5) + 'rem' : '1.2rem';
    el.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  // Base numbers (starting point) + real Firebase counts = live totals
  const VISIT_BASE = 11936;
  const LOVE_BASE = 3567;
  const visitPill = document.getElementById('visit-pill');
  const lovePill = document.getElementById('love-pill');
  const visitCount = document.getElementById('visit-count');
  const loveCount = document.getElementById('love-count');
  const loveHint = document.getElementById('love-hint');
  let shownV = -1, shownL = -1;

  // Prothombar jara dhukbe tader invite — hint + glow, react korlei chirotore off
  let hintTimer = null;
  function showInvite() {
    try { if (localStorage.getItem('love_reacted')) return; } catch (e) {}
    lovePill.classList.add('invite');
    hintTimer = setTimeout(() => loveHint.classList.add('hide'), 6000);
  }
  function markReacted() {
    try { localStorage.setItem('love_reacted', '1'); } catch (e) {}
    lovePill.classList.remove('invite');
    loveHint.classList.add('hide');
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  }
  showInvite();

  function pop(el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

  function renderVisits(n) {
    const total = VISIT_BASE + n;
    const txt = total.toLocaleString('en-US');
    if (txt !== visitCount.textContent) {
      visitCount.textContent = txt;
      visitCount.classList.remove('dots');
      if (shownV >= 0) pop(visitPill);
      shownV = total;
    }
  }

  function renderLoves(n) {
    const total = LOVE_BASE + n;
    const txt = total.toLocaleString('en-US');
    if (txt !== loveCount.textContent) {
      loveCount.textContent = txt;
      loveCount.classList.remove('dots');
      if (shownL >= 0) pop(lovePill);
      shownL = total;
    }
  }

  // Floating hearts burst when the love button is tapped
  function burstHearts() {
    const r = lovePill.getBoundingClientRect();
    const icons = ['💗', '💖', '💕', '🌸'];
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('span');
      s.className = 'mini-heart';
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = (r.left + r.width / 2 + (Math.random() * 60 - 30)) + 'px';
      s.style.top = (r.top - 4) + 'px';
      s.style.animationDelay = (Math.random() * 0.15) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1500);
    }
  }

  // Offline fallback — jate kokhono faka na dekhay
  function fallback() {
    let v = 0, l = 0;
    try {
      v = parseInt(localStorage.getItem('love_local_visits') || '0', 10) || 0;
      l = parseInt(localStorage.getItem('love_local_loves') || '0', 10) || 0;
      if (!sessionStorage.getItem('love_counted')) {
        v += 1;
        localStorage.setItem('love_local_visits', String(v));
        sessionStorage.setItem('love_counted', '1');
      }
    } catch (e) {}
    renderVisits(v);
    renderLoves(l);
  }

  let db = null, dbRef = null;

  // Unlimited reacts — protita tap count hobe; druto tap gulo ek transaction-e batch hoye jabe
  let pendingLoves = 0, flushing = false;
  async function flushLoves() {
    if (flushing || pendingLoves <= 0 || !dbRef) return;
    flushing = true;
    const batch = pendingLoves;
    pendingLoves = 0;
    try {
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(dbRef);
        const cur = snap.exists() ? (snap.data().loves || 0) : 0;
        tx.set(dbRef, { loves: cur + batch }, { merge: true });
      });
    } catch (e) { /* rules block korle read-only cholbe */ }
    flushing = false;
    if (pendingLoves > 0) flushLoves();
  }

  lovePill.addEventListener('click', () => {
    burstHearts();
    pop(lovePill);
    markReacted();
    if (!dbRef) { // offline: local count
      try {
        const l = (parseInt(localStorage.getItem('love_local_loves') || '0', 10) || 0) + 1;
        localStorage.setItem('love_local_loves', String(l));
        renderLoves(l);
      } catch (e) {}
      return;
    }
    pendingLoves++;
    flushLoves();
  });

  (async function initCounter() {
    try {
      const app = initializeApp({
        apiKey: "AIzaSyAEhj7lnf9ACXniCd_Y7IuD_q6lC_Phbt4",
        authDomain: "vortex-cc.firebaseapp.com",
        projectId: "vortex-cc",
        storageBucket: "vortex-cc.firebasestorage.app",
        messagingSenderId: "245429871243",
        appId: "1:245429871243:web:bba43b62ab314569a72a8e"
      });
      db = getFirestore(app);
      dbRef = doc(db, 'loveStats', 'visits');

      // Ek session-e ekbar visit count (refresh spam hobe na)
      if (!sessionStorage.getItem('love_counted')) {
        sessionStorage.setItem('love_counted', '1');
        try {
          await runTransaction(db, async (tx) => {
            const snap = await tx.get(dbRef);
            const cur = snap.exists() ? (snap.data().count || 0) : 0;
            tx.set(dbRef, { count: cur + 1 }, { merge: true });
          });
        } catch (e) { /* rules block korle read-only cholbe */ }
      }

      // Live update — keu visit/react korlei sobar screen-e number barbe
      onSnapshot(dbRef, (snap) => {
        const d = snap.exists() ? snap.data() : {};
        renderVisits(d.count || 0);
        renderLoves(d.loves || 0);
      }, () => fallback());
    } catch (e) { fallback(); }
  })();
</script>
