<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 A Little Question...</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6b9d;
    --deep: #c9184a;
    --soft: #ffd6e7;
    --cream: #fff0f6;
    --ink: #ffe9f2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    background: #ffe4ee;
    font-family: 'Lato', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    color: #8a2440;
  }

  /* ===== LIVE VIDEO BACKGROUND ===== */
  #bg-video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    animation: slowZoom 36s ease-in-out infinite alternate;
  }
  @keyframes slowZoom {
    from { transform: scale(1); }
    to { transform: scale(1.09); }
  }

  /* Cinematic color grade over the video */
  .grade {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(255,255,255,0.25) 0%, transparent 60%),
      linear-gradient(180deg, rgba(255,240,246,0.5) 0%, rgba(255,240,246,0.18) 40%, rgba(255,228,238,0.45) 100%);
  }

  /* Vignette */
  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(255,182,205,0.4) 100%);
  }

  /* Floating hearts + sparkles */
  .hearts-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  .bg-heart {
    position: absolute;
    font-size: 1.2rem;
    opacity: 0.35;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,107,157,0.7));
  }

  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    12% { opacity: 0.4; }
    50% { opacity: 0.35; }
    88% { opacity: 0.25; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  .sparkle {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px 2px rgba(255,214,231,0.9);
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; transform: scale(0.4); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Main card — midnight glass */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(22px) saturate(1.4);
    -webkit-backdrop-filter: blur(22px) saturate(1.4);
    border-radius: 32px;
    padding: 52px 44px 44px;
    max-width: 480px;
    width: 92vw;
    text-align: center;
    box-shadow:
      0 30px 80px rgba(201,24,74,0.22),
      0 0 70px rgba(255,182,205,0.45),
      inset 0 1px 0 rgba(255,255,255,0.9);
    border: 1.5px solid rgba(255,255,255,0.7);
  }

  .card::before {
    content: '';
    position: absolute;
    inset: -1.5px;
    border-radius: 33px;
    padding: 1.5px;
    background: linear-gradient(135deg, rgba(255,107,157,0.7), transparent 30%, transparent 70%, rgba(255,182,213,0.6));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* Watermark */
  .watermark {
    position: fixed;
    bottom: 16px;
    right: 20px;
    z-index: 999;
    font-family: 'Playfair Display', serif;
    font-size: 0.75rem;
    color: rgba(160,40,90,0.6);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 4px;
    user-select: none;
    text-shadow: 0 1px 6px rgba(255,255,255,0.7);
  }
  .watermark span { font-weight: 700; color: rgba(160,40,90,0.85); }

  /* Music toggle */
  #music-toggle {
    position: fixed;
    bottom: 14px;
    left: 16px;
    z-index: 999;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(10px);
    color: var(--deep);
    font-size: 1.15rem;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
  }
  #music-toggle:hover { transform: scale(1.1); box-shadow: 0 4px 22px rgba(255,107,157,0.4); }

  /* Start screen */
  #start-screen { display: flex; flex-direction: column; align-items: center; gap: 20px; }

  .big-heart {
    font-size: 5rem;
    animation: heartBeat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 4px 24px rgba(255,107,157,0.8));
  }

  @keyframes heartBeat {
    0%,100% { transform: scale(1); }
    14% { transform: scale(1.15); }
    28% { transform: scale(1); }
    42% { transform: scale(1.1); }
    70% { transform: scale(1); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: 2.1rem;
    line-height: 1.25;
    background: linear-gradient(100deg, #c9184a, #ff5c8a, #e5387c, #ff5c8a, #c9184a);
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite;
    filter: drop-shadow(0 2px 10px rgba(255,107,157,0.3));
  }
  @keyframes shimmer {
    to { background-position: 250% center; }
  }

  .subtitle {
    font-size: 0.95rem;
    color: #a0496a;
    font-weight: 300;
    letter-spacing: 0.06em;
  }

  .btn-start {
    margin-top: 8px;
    background: linear-gradient(135deg, var(--pink), var(--deep));
    color: white;
    border: none;
    padding: 16px 52px;
    border-radius: 50px;
    font-size: 1.05rem;
    font-family: 'Playfair Display', serif;
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(255,107,157,0.45), 0 0 0 1px rgba(255,255,255,0.15) inset;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-start::after {
    content: '';
    position: absolute;
    top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    animation: btnShine 3.2s ease-in-out infinite;
  }
  @keyframes btnShine {
    0%, 60% { left: -80%; }
    100% { left: 160%; }
  }
  .btn-start:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 14px 44px rgba(255,107,157,0.6);
  }
  .btn-start:active { transform: scale(0.97); }

  /* Question screen */
  #question-screen { display: none; flex-direction: column; align-items: center; gap: 28px; }

  .progress-wrap {
    width: 100%;
    background: rgba(255,107,157,0.15);
    border-radius: 50px;
    height: 8px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), #ff8fb5, var(--deep));
    border-radius: 50px;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 12px rgba(255,107,157,0.8);
  }

  .step-label {
    font-size: 0.78rem;
    color: #c47a8f;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .question-emoji {
    width: 130px;
    height: 130px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 10px 34px rgba(0,0,0,0.5),
      0 0 28px rgba(255,107,157,0.35),
      inset 0 1px 0 rgba(255,255,255,0.25);
    border: 3px solid rgba(255,255,255,0.3);
    animation: pop 0.4s cubic-bezier(.4,0,.2,1);
  }

  .question-emoji img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: #7d1030;
    line-height: 1.45;
    font-style: italic;
    animation: fadeSlide 0.45s ease;
    text-shadow: 0 2px 18px rgba(255,107,157,0.4);
  }

  @keyframes fadeSlide {
    0% { opacity: 0; transform: translateY(18px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .btn-row {
    display: flex;
    gap: 16px;
    margin-top: 4px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-yes {
    background: linear-gradient(135deg, #ff6b9d, #c9184a);
    color: white;
    border: none;
    padding: 15px 44px;
    border-radius: 50px;
    font-size: 1rem;
    font-family: 'Playfair Display', serif;
    cursor: pointer;
    box-shadow: 0 6px 26px rgba(255,107,157,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.04em;
  }
  .btn-yes:hover { transform: scale(1.07); box-shadow: 0 10px 36px rgba(255,107,157,0.65); }
  .btn-yes:active { transform: scale(0.96); }

  .btn-no {
    background: rgba(255,107,157,0.1);
    color: var(--deep);
    border: 2px solid rgba(255,107,157,0.45);
    padding: 13px 36px;
    border-radius: 50px;
    font-size: 1rem;
    font-family: 'Playfair Display', serif;
    cursor: pointer;
    transition: left 0.18s ease, top 0.18s ease, transform 0.15s ease;
    letter-spacing: 0.04em;
    position: relative;
    z-index: 50;
    backdrop-filter: blur(6px);
  }
  .btn-no.roaming {
    position: absolute;
    z-index: 1000;
  }

  /* Final screen */
  #final-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .burst-container {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .final-heart {
    font-size: 4.5rem;
    animation: heartBeat 1.2s ease-in-out infinite;
    filter: drop-shadow(0 6px 28px rgba(255,107,157,0.9));
    z-index: 2;
    position: relative;
  }

  .orbit-heart {
    position: absolute;
    font-size: 1.2rem;
    animation: orbit linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,107,157,0.8));
  }

  @keyframes orbit {
    from { transform: rotate(var(--start)) translateX(50px) rotate(calc(-1 * var(--start))); }
    to { transform: rotate(calc(var(--start) + 360deg)) translateX(50px) rotate(calc(-1 * (var(--start) + 360deg))); }
  }

  .final-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.1rem;
    line-height: 1.3;
    background: linear-gradient(100deg, #c9184a, #ff5c8a, #e5387c, #ff5c8a, #c9184a);
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite;
  }

  .final-msg {
    font-size: 1.05rem;
    color: #a0496a;
    font-weight: 300;
    font-style: italic;
    line-height: 1.7;
  }

  .final-sub {
    font-size: 0.88rem;
    color: #c47a8f;
    letter-spacing: 0.04em;
  }

  .final-gif-wrap {
    width: 160px;
    height: 160px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
      0 16px 44px rgba(0,0,0,0.5),
      0 0 32px rgba(255,107,157,0.4),
      inset 0 1px 0 rgba(255,255,255,0.25);
    border: 3px solid rgba(255,255,255,0.3);
    animation: gifPop 0.5s cubic-bezier(.34,1.56,.64,1);
  }

  .final-gif {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes gifPop {
    0% { opacity: 0; transform: scale(0.7) rotate(-4deg); }
    70% { transform: scale(1.05) rotate(1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .confetti-heart {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-size: 1.5rem;
    animation: confettiFall 2.5s ease-in forwards;
    filter: drop-shadow(0 0 6px rgba(255,107,157,0.8));
  }

  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }

  .no-msg-toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    padding: 8px 18px 8px 8px;
    border-radius: 50px;
    box-shadow: 0 10px 32px rgba(201,24,74,0.3), 0 0 24px rgba(255,182,205,0.4);
    border: 1.5px solid rgba(255,107,157,0.45);
    opacity: 0;
    pointer-events: none;
    text-align: left;
    max-width: 88vw;
  }

  .no-msg-toast.show {
    animation: toastPop 12s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .no-msg-gif {
    width: 42px;
    height: 42px;
    object-fit: cover;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .no-msg-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--deep);
    line-height: 1.3;
  }

  @keyframes toastPop {
    0% { opacity: 0; transform: translateX(-50%) translateY(-14px) scale(0.9); }
    10% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    88% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.95); }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ===== LIVE VIDEO BACKGROUND (Midnight Tram) ===== -->
<video id="bg-video" autoplay muted loop playsinline preload="auto">
  <source src="sakura-tree-landscape.mp4" type="video/mp4">
</video>
<div class="grade"></div>
<div class="vignette"></div>

<!-- Floating hearts + sparkles -->
<div class="hearts-bg" id="hearts-bg"></div>

<!-- Watermark -->
<div class="watermark">❤️ Made by <span>Nafiz</span></div>

<!-- Music toggle -->
<button id="music-toggle" onclick="toggleMusic()" title="Music on/off">🔊</button>

<!-- Background music -->
<audio id="bg-music" preload="auto"></audio>

<div class="card">

  <!-- START SCREEN -->
  <div id="start-screen">
    <div class="big-heart">💖</div>
    <h1 class="title">I have something<br>to ask you…</h1>
    <p class="subtitle">Just a few little questions 🌸</p>
    <button class="btn-start" onclick="startGame()">Let's Begin ✨</button>
  </div>

  <!-- QUESTION SCREEN -->
  <div id="question-screen">
    <div style="width:100%">
      <div class="step-label" id="step-label">Question 1 of 10</div>
      <div style="height:8px"></div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar" style="width:0%"></div>
      </div>
    </div>
    <div class="question-emoji"><img id="q-emoji" src="" alt=""></div>
    <div class="question-text" id="q-text">Loading...</div>
    <div class="btn-row" id="btn-row">
      <button class="btn-no" id="btn-no" onmouseenter="dodgeNo()" onclick="dodgeNo()">No 🙈</button>
      <button class="btn-yes" onclick="answerYes()">Yes 💕</button>
    </div>
  </div>

  <!-- FINAL SCREEN -->
  <div id="final-screen">
    <div class="burst-container">
      <div class="final-heart">💖</div>
      <div class="orbit-heart" style="--start:0deg; animation-duration:3s;">💗</div>
      <div class="orbit-heart" style="--start:120deg; animation-duration:3.5s;">💕</div>
      <div class="orbit-heart" style="--start:240deg; animation-duration:2.8s;">✨</div>
    </div>
    <h2 class="final-title">Aww 💖<br>You made me happy!</h2>
    <div class="final-gif-wrap">
      <img class="final-gif" id="final-gif" src="" alt="">
    </div>
    <p class="final-msg">"I knew you'd choose me 😊<br>You're truly special to me."</p>
    <p class="final-sub">— with love, always 🌸</p>
  </div>

</div>

<!-- Floating "No" message toast — shows over the card with a cat gif -->
<div class="no-msg-toast" id="no-msg-toast">
  <img class="no-msg-gif" id="no-msg-gif" src="" alt="">
  <div class="no-msg-text" id="no-msg-text"></div>
</div>

<script>
  const questions = [
    { gif: "https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyZDk5N2ttN2pyMGwxbGEyMHV5ajhnbjRjejJrbGZ2NDZteWk4a2pvdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3IssNhLo1hCEnRhgZP/giphy.gif", text: "Do you like me?" },
    { gif: "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUybWk4MXhtcmIyeXN2NTkybnl6OWI2M2k5Zjd0endtZG0zcXh6djl5NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/XaikVL6qbrJSJoQmCR/giphy.gif", text: "Do you think about me?" },
    { gif: "https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyZ2tyemt2NWc3ZGo4Z3J1YzR6bGlxdG5kNnk2cm1ldTlqejdpMWxvYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/u62ibpUyRSvJ0PyXJU/giphy.gif", text: "Am I special to you?" },
    { gif: "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyMGN3M240amxmODJ5eHhzZHZ5c2IwNW5jNTY5Ymwzbmh0aXZvN2duMCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/kKeJ4JuNkaEZbkPOOL/giphy.gif", text: "Will you stay with me?" },
    { gif: "https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyZWRxYW43dGxtN2pyMGwxbGEyMHV5ajhnbjRjejJrbGZ2NDZteWk4a2pvdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/W8hVGGjOjV82Rh6Oyi/giphy.gif", text: "Do you love me?" },
    { gif: "https://media.giphy.com/media/CCgFT3eoyTfRpLpro9/giphy.gif", text: "Will you cuddle with me forever? 🤗" },
    { gif: "https://media.giphy.com/media/aiUp1iKf84E1NtL2ye/giphy.gif", text: "Can I be the reason for your smile? 😊" },
    { gif: "https://media.giphy.com/media/WuqPnGVPg5jJwcJYBU/giphy.gif", text: "Will you be mine? 💍" },
    { gif: "https://media.giphy.com/media/vkO8ectZLj9EQ/giphy.gif", text: "Do you dream about us too? 🌙" },
    { gif: "https://media.giphy.com/media/TvQO0hfYTrnGdz4X11/giphy.gif", text: "Will you say YES to forever with me? 💒" }
  ];

  let current = 0;

  // ============================================
  // 🎵 MUSIC SETUP — songs added here
  // ============================================
  // mp3 file গুলো index.html-er thik pashei rakha royeche (kono folder chara),
  // tai list-e শুধু file naam likha royeche, path na diye.
  var songs = [
    "song1.mp3",
    "song2.mp3",
    "song3.mp3",
    "song4.mp3",
    "song5.mp3"
  ];

  var bgMusic = document.getElementById('bg-music');
  var musicOn = localStorage.getItem('prop_music_pref') !== 'off';
  var currentSongIndex = -1;

  function shuffledSongs(avoidFirst) {
    var arr = songs.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    if (avoidFirst && arr.length > 1 && arr[0] === avoidFirst) {
      var t2 = arr[0]; arr[0] = arr[1]; arr[1] = t2;
    }
    return arr;
  }

  function getSongQueue() {
    var lastPlayed = localStorage.getItem('prop_last_song');
    try {
      var q = JSON.parse(localStorage.getItem('prop_song_queue') || "[]");
      q = q.filter(function (s) { return songs.indexOf(s) !== -1; });
      if (!q.length) throw 0;
      return q;
    } catch (e) {
      return shuffledSongs(lastPlayed);
    }
  }

  function pickNextSongIndex() {
    if (songs.length <= 1) return 0;
    var queue = getSongQueue();
    var next = queue.shift();
    if (!queue.length) queue = shuffledSongs(next);
    localStorage.setItem('prop_song_queue', JSON.stringify(queue));
    localStorage.setItem('prop_last_song', next);
    return songs.indexOf(next);
  }

  function loadAndPlay(index) {
    currentSongIndex = index;
    bgMusic.src = songs[index];
    if (!musicOn) return;
    var p = bgMusic.play();
    if (p && p.catch) {
      p.catch(function () {
        document.addEventListener('click', resumeOnInteract, { once: true });
        document.addEventListener('touchstart', resumeOnInteract, { once: true });
      });
    }
  }
  function resumeOnInteract() {
    if (musicOn) bgMusic.play().catch(function () {});
  }

  bgMusic.addEventListener('ended', function () {
    loadAndPlay(pickNextSongIndex());
  });
  bgMusic.addEventListener('error', function () {
    loadAndPlay(pickNextSongIndex());
  });

  function startMusic() {
    loadAndPlay(pickNextSongIndex());
  }

  function toggleMusic() {
    musicOn = !musicOn;
    localStorage.setItem('prop_music_pref', musicOn ? 'on' : 'off');
    if (musicOn) {
      bgMusic.play().catch(function () {});
    } else {
      bgMusic.pause();
    }
    updateMusicBtn();
  }
  window.toggleMusic = toggleMusic;

  function updateMusicBtn() {
    var btn = document.getElementById('music-toggle');
    if (btn) btn.textContent = musicOn ? '🔊' : '🔇';
  }
  updateMusicBtn();

    const h = document.createElement('div');

    h.textContent = ['💗','💕','💖','🌸','✨','💝'][Math.floor(Math.random()*6)];

    h.style.animationDuration = (8 + Math.random() * 12) + 's';
    h.style.animationDelay = (-Math.random() * 20) + 's';
    h.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';

  }
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (1.5 + Math.random() * 3) + 's';
    s.style.animationDelay = (-Math.random() * 4) + 's';
    const sz = 2 + Math.random() * 4;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';

  }

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    const qs = document.getElementById('question-screen');
    qs.style.display = 'flex';
    showQuestion();
    startMusic();
  }

  function showQuestion() {
    const q = questions[current];
    document.getElementById('q-emoji').src = q.gif;
    const el = document.getElementById('q-text');
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = '';
    el.textContent = q.text;

    const pct = (current / questions.length) * 100;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('step-label').textContent = `Question ${current+1} of ${questions.length}`;

    const noBtn = document.getElementById('btn-no');
    noBtn.classList.remove('roaming');
    noBtn.style.position = '';
    noBtn.style.left = '';
    noBtn.style.top = '';
    noBtn.style.transform = '';

    const toastEl = document.getElementById('no-msg-toast');
    toastEl.classList.remove('show');
    document.getElementById('no-msg-text').textContent = '';
    document.getElementById('no-msg-gif').src = '';
    dodgeCount = 0;
  }

  function answerYes() {
    spawnConfetti();

  let lastPairIndex = -1;

  function showNoMessage() {
    const toast = document.getElementById('no-msg-toast');
    const textEl = document.getElementById('no-msg-text');
    const gifEl = document.getElementById('no-msg-gif');

    // Ager bar jeta esechilo seta bad diye notun ekta pair nao
    let idx;
    do {
      idx = Math.floor(Math.random() * noPairs.length);
    } while (idx === lastPairIndex && noPairs.length > 1);
    lastPairIndex = idx;

    toast.classList.remove('show');
    void toast.offsetWidth;
    gifEl.src = noPairs[idx].g;
    textEl.textContent = noPairs[idx].t;
    toast.classList.add('show');
  }

  let dodgeCount = 0;
  function dodgeNo() {
    dodgeCount++;
    showNoMessage();
    const btn = document.getElementById('btn-no');
    const yesBtn = document.querySelector('.btn-yes');
    const card = document.querySelector('.card');

    const btnW = btn.offsetWidth || 110;
    const btnH = btn.offsetHeight || 46;
    const padding = 14;
    const buffer = 20;

    const cardW = card.clientWidth;
    const cardH = card.clientHeight;

    const minLeft = padding;
    const maxLeft = cardW - btnW - padding;
    const minTop = padding;
    const maxTop = cardH - btnH - padding;

    const yesLeft = yesBtn.offsetLeft;
    const yesTop = yesBtn.offsetTop;
    const yesRight = yesLeft + yesBtn.offsetWidth;
    const yesBottom = yesTop + yesBtn.offsetHeight;

    let newLeft, newTop, tries = 0;
    do {
      newLeft = minLeft + Math.random() * Math.max(0, maxLeft - minLeft);
      newTop = minTop + Math.random() * Math.max(0, maxTop - minTop);
      tries++;
    } while (
      tries < 15 &&
      newLeft < yesRight + buffer &&
      newLeft + btnW > yesLeft - buffer &&
      newTop < yesBottom + buffer &&
      newTop + btnH > yesTop - buffer
    );

    btn.classList.add('roaming');
    btn.style.left = newLeft + 'px';
    btn.style.top = newTop + 'px';
  }

  function spawnConfetti(big = false) {
    const emojis = ['💗','💕','💖','💝','🌸','✨','💓','🥰'];
    const el = document.createElement('div');
    el.className = 'confetti-heart';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (10 + Math.random() * 80) + 'vw';
    el.style.top = '0';
    el.style.fontSize = big ? (1.5 + Math.random() * 1.5) + 'rem' : '1.2rem';
    el.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
