<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 A Little Question...</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6b9d;
    --deep: #c9184a;
    --soft: #ffd6e7;
    --cream: #fff0f6;
    --dark: #4a0e1e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe0ec 0%, #ffc2d4 30%, #ffb3c6 60%, #ff85a1 100%);
    font-family: 'Lato', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Floating hearts background */
  .hearts-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .bg-heart {
    position: absolute;
    font-size: 1.2rem;
    opacity: 0.15;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0.1; }
    50% { opacity: 0.2; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* Main card */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 52px 44px 44px;
    max-width: 480px;
    width: 92vw;
    text-align: center;
    box-shadow:
      0 30px 80px rgba(201,24,74,0.18),
      0 8px 24px rgba(255,107,157,0.15),
      inset 0 1px 0 rgba(255,255,255,0.9);
    border: 1.5px solid rgba(255,107,157,0.25);
  }

  /* Watermark */
  .watermark {
    position: fixed;
    bottom: 16px;
    right: 20px;
    z-index: 999;
    font-family: 'Playfair Display', serif;
    font-size: 0.75rem;
    color: rgba(201,24,74,0.5);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 4px;
    user-select: none;
  }
  .watermark span { font-weight: 700; color: rgba(201,24,74,0.7); }

  /* Start screen */
  #start-screen { display: flex; flex-direction: column; align-items: center; gap: 20px; }

  .big-heart {
    font-size: 5rem;
    animation: heartBeat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 4px 16px rgba(255,107,157,0.5));
  }

  @keyframes heartBeat {
    0%,100% { transform: scale(1); }
    14% { transform: scale(1.15); }
    28% { transform: scale(1); }
    42% { transform: scale(1.1); }
    70% { transform: scale(1); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--dark);
    line-height: 1.2;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #a0496a;
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  .btn-start {
    margin-top: 8px;
    background: linear-gradient(135deg, var(--pink), var(--deep));
    color: white;
    border: none;
    padding: 16px 52px;
    border-radius: 50px;
    font-size: 1.05rem;
    font-family: 'Playfair Display', serif;
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(201,24,74,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-start:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 14px 36px rgba(201,24,74,0.45);
  }
  .btn-start:active { transform: scale(0.97); }

  /* Question screen */
  #question-screen { display: none; flex-direction: column; align-items: center; gap: 28px; }

  .progress-wrap {
    width: 100%;
    background: rgba(255,107,157,0.15);
    border-radius: 50px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--deep));
    border-radius: 50px;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 2px 8px rgba(201,24,74,0.3);
  }

  .step-label {
    font-size: 0.78rem;
    color: #c47a8f;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .question-emoji {
    width: 130px;
    height: 130px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 10px 30px rgba(201,24,74,0.25),
      inset 0 1px 0 rgba(255,255,255,0.6);
    border: 3px solid rgba(255,255,255,0.85);
    animation: pop 0.4s cubic-bezier(.4,0,.2,1);
  }

  .question-emoji img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.55rem;
    color: var(--dark);
    line-height: 1.45;
    font-style: italic;
    animation: fadeSlide 0.45s ease;
  }

  @keyframes fadeSlide {
    0% { opacity: 0; transform: translateY(18px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .btn-row {
    display: flex;
    gap: 16px;
    margin-top: 4px;
    flex-wrap: wrap;
    justify-content: center;
    position: relative;
  }

  .btn-yes {
    background: linear-gradient(135deg, #ff6b9d, #c9184a);
    color: white;
    border: none;
    padding: 15px 44px;
    border-radius: 50px;
    font-size: 1rem;
    font-family: 'Playfair Display', serif;
    cursor: pointer;
    box-shadow: 0 6px 22px rgba(201,24,74,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.04em;
  }
  .btn-yes:hover { transform: scale(1.07); box-shadow: 0 10px 30px rgba(201,24,74,0.45); }
  .btn-yes:active { transform: scale(0.96); }

  .btn-no {
    background: rgba(255,107,157,0.12);
    color: var(--deep);
    border: 2px solid rgba(255,107,157,0.4);
    padding: 13px 36px;
    border-radius: 50px;
    font-size: 1rem;
    font-family: 'Playfair Display', serif;
    cursor: pointer;
    transition: left 0.18s ease, top 0.18s ease, transform 0.15s ease;
    letter-spacing: 0.04em;
    position: relative;
    z-index: 50;
  }
  .btn-no.roaming {
    position: fixed;
    z-index: 1000;
  }

  /* Final screen */
  #final-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .burst-container {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .final-heart {
    font-size: 4.5rem;
    animation: heartBeat 1.2s ease-in-out infinite;
    filter: drop-shadow(0 6px 20px rgba(255,107,157,0.6));
    z-index: 2;
    position: relative;
  }

  .orbit-heart {
    position: absolute;
    font-size: 1.2rem;
    animation: orbit linear infinite;
  }

  @keyframes orbit {
    from { transform: rotate(var(--start)) translateX(50px) rotate(calc(-1 * var(--start))); }
    to { transform: rotate(calc(var(--start) + 360deg)) translateX(50px) rotate(calc(-1 * (var(--start) + 360deg))); }
  }

  .final-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--dark);
    line-height: 1.3;
  }

  .final-msg {
    font-size: 1.05rem;
    color: #a0496a;
    font-weight: 300;
    font-style: italic;
    line-height: 1.7;
  }

  .final-sub {
    font-size: 0.88rem;
    color: #c47a8f;
    letter-spacing: 0.04em;
  }

  .final-gif-wrap {
    width: 160px;
    height: 160px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
      0 16px 40px rgba(201,24,74,0.28),
      0 4px 14px rgba(255,107,157,0.25),
      inset 0 1px 0 rgba(255,255,255,0.6);
    border: 3px solid rgba(255,255,255,0.85);
    animation: gifPop 0.5s cubic-bezier(.34,1.56,.64,1);
  }

  .final-gif {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes gifPop {
    0% { opacity: 0; transform: scale(0.7) rotate(-4deg); }
    70% { transform: scale(1.05) rotate(1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .confetti-heart {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-size: 1.5rem;
    animation: confettiFall 2.5s ease-in forwards;
  }

  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }

  .no-msg-toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.97);
    padding: 8px 18px 8px 8px;
    border-radius: 50px;
    box-shadow: 0 10px 28px rgba(201,24,74,0.3);
    border: 1.5px solid rgba(255,107,157,0.35);
    opacity: 0;
    pointer-events: none;
    text-align: left;
    max-width: 88vw;
  }

  .no-msg-toast.show {
    animation: toastPop 12s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .no-msg-gif {
    width: 42px;
    height: 42px;
    object-fit: cover;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .no-msg-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--deep);
    line-height: 1.3;
  }

  @keyframes toastPop {
    0% { opacity: 0; transform: translateX(-50%) translateY(-14px) scale(0.9); }
    10% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    88% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.95); }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Floating hearts background -->
<div class="hearts-bg" id="hearts-bg"></div>

<!-- Watermark -->
<div class="watermark">❤️ Made by <span>Nafiz</span></div>

<!-- Background music -->
<audio id="bg-music" preload="auto"></audio>

<div class="card">

  <!-- START SCREEN -->
  <div id="start-screen">
    <div class="big-heart">💖</div>
    <h1 class="title">I have something<br>to ask you…</h1>
    <p class="subtitle">Just a few little questions 🌸</p>
    <button class="btn-start" onclick="startGame()">Let's Begin ✨</button>
  </div>

  <!-- QUESTION SCREEN -->
  <div id="question-screen">
    <div style="width:100%">
      <div class="step-label" id="step-label">Question 1 of 5</div>
      <div style="height:8px"></div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar" style="width:0%"></div>
      </div>
    </div>
    <div class="question-emoji"><img id="q-emoji" src="" alt=""></div>
    <div class="question-text" id="q-text">Loading...</div>
    <div class="btn-row" id="btn-row">
      <button class="btn-no" id="btn-no" onmouseenter="dodgeNo()" onclick="dodgeNo()">No 🙈</button>
      <button class="btn-yes" onclick="answerYes()">Yes 💕</button>
    </div>
  </div>

  <!-- FINAL SCREEN -->
  <div id="final-screen">
    <div class="burst-container">
      <div class="final-heart">💖</div>
      <div class="orbit-heart" style="--start:0deg; animation-duration:3s;">💗</div>
      <div class="orbit-heart" style="--start:120deg; animation-duration:3.5s;">💕</div>
      <div class="orbit-heart" style="--start:240deg; animation-duration:2.8s;">✨</div>
    </div>
    <h2 class="final-title">Aww 💖<br>You made me happy!</h2>
    <div class="final-gif-wrap">
      <img class="final-gif" id="final-gif" src="" alt="">
    </div>
    <p class="final-msg">"I knew you'd choose me 😊<br>You're truly special to me."</p>
    <p class="final-sub">— with love, always 🌸</p>
  </div>

</div>

<!-- Floating "No" message toast — shows over the card with a cat gif -->
<div class="no-msg-toast" id="no-msg-toast">
  <img class="no-msg-gif" id="no-msg-gif" src="" alt="">
  <div class="no-msg-text" id="no-msg-text"></div>
</div>

<script>
  const questions = [
    { gif: "https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyZDk5N2ttN2pyMGwxbGEyMHV5ajhnbjRjejJrbGZ2NDZteWk4a2pvdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3IssNhLo1hCEnRhgZP/giphy.gif", text: "Do you like me?" },
    { gif: "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUybWk4MXhtcmIyeXN2NTkybnl6OWI2M2k5Zjd0endtZG0zcXh6djl5NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/XaikVL6qbrJSJoQmCR/giphy.gif", text: "Do you think about me?" },
    { gif: "https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyZ2tyemt2NWc3ZGo4Z3J1YzR6bGlxdG5kNnk2cm1ldTlqejdpMWxvYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/u62ibpUyRSvJ0PyXJU/giphy.gif", text: "Am I special to you?" },
    { gif: "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyMGN3M240amxmODJ5eHhzZHZ5c2IwNW5jNTY5Ymwzbmh0aXZvN2duMCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/kKeJ4JuNkaEZbkPOOL/giphy.gif", text: "Will you stay with me?" },
    { gif: "https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyZWRxYW43dGxtNno1d215bDd1a3dvdDQ1MGI4cW9sOTVyY2ZqdzhwbyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/W8hVGGjOjV82Rh6Oyi/giphy.gif", text: "Do you love me?" }
  ];

  let current = 0;

  // ============================================
  // 🎵 MUSIC SETUP — songs added here
  // ============================================
  // mp3 file গুলো index.html-er thik pashei rakha royeche (kono folder chara),
  // tai list-e শুধু file naam likha royeche, path na diye.
  // Ei system ta full shuffle-queue — sob song ekbar kore na bajা porjonto
  // repeat hoবে na, ar page refresh korleo continue thakবে.
  var songs = [
    "song1.mp3",
    "song2.mp3",
    "song3.mp3",
    "song4.mp3",
    "song5.mp3"
  ];

  var bgMusic = document.getElementById('bg-music');
  var musicOn = localStorage.getItem('prop_music_pref') !== 'off';
  var currentSongIndex = -1;

  function shuffledSongs(avoidFirst) {
    var arr = songs.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    if (avoidFirst && arr.length > 1 && arr[0] === avoidFirst) {
      var t2 = arr[0]; arr[0] = arr[1]; arr[1] = t2;
    }
    return arr;
  }

  function getSongQueue() {
    var lastPlayed = localStorage.getItem('prop_last_song');
    try {
      var q = JSON.parse(localStorage.getItem('prop_song_queue') || "[]");
      q = q.filter(function (s) { return songs.indexOf(s) !== -1; });
      if (!q.length) throw 0;
      return q;
    } catch (e) {
      return shuffledSongs(lastPlayed);
    }
  }

  function pickNextSongIndex() {
    if (songs.length <= 1) return 0;
    var queue = getSongQueue();
    var next = queue.shift();
    if (!queue.length) queue = shuffledSongs(next);
    localStorage.setItem('prop_song_queue', JSON.stringify(queue));
    localStorage.setItem('prop_last_song', next);
    return songs.indexOf(next);
  }

  function loadAndPlay(index) {
    currentSongIndex = index;
    bgMusic.src = songs[index];
    if (!musicOn) return;
    var p = bgMusic.play();
    if (p && p.catch) {
      // Kono karone (browser autoplay block ইত্যাদি) play na hole,
      // user er porer je kono tap/click e abar try korbe — jate
      // shob device e (Android, iOS, desktop) music shuna jay.
      p.catch(function () {
        document.addEventListener('click', resumeOnInteract, { once: true });
        document.addEventListener('touchstart', resumeOnInteract, { once: true });
      });
    }
  }
  function resumeOnInteract() {
    if (musicOn) bgMusic.play().catch(function () {});
  }

  bgMusic.addEventListener('ended', function () {
    loadAndPlay(pickNextSongIndex());
  });
  bgMusic.addEventListener('error', function () {
    // Kono song file na paওয়া গেলে seta skip kore porerটা bajবে
    loadAndPlay(pickNextSongIndex());
  });

  function startMusic() {
    loadAndPlay(pickNextSongIndex());
  }

  function toggleMusic() {
    musicOn = !musicOn;
    localStorage.setItem('prop_music_pref', musicOn ? 'on' : 'off');
    if (musicOn) {
      bgMusic.play().catch(function () {});
    } else {
      bgMusic.pause();
    }
    updateMusicBtn();
  }
  window.toggleMusic = toggleMusic;

  function updateMusicBtn() {
    var btn = document.getElementById('music-toggle');
    if (btn) btn.textContent = musicOn ? '🔊' : '🔇';
  }
  updateMusicBtn();

  // Generate background hearts
  const bg = document.getElementById('hearts-bg');
  for (let i = 0; i < 24; i++) {
    const h = document.createElement('div');
    h.className = 'bg-heart';
    h.textContent = ['💗','💕','💖','🌸','✨','💝'][Math.floor(Math.random()*6)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (8 + Math.random() * 12) + 's';
    h.style.animationDelay = (-Math.random() * 20) + 's';
    h.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
    bg.appendChild(h);
  }

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    const qs = document.getElementById('question-screen');
    qs.style.display = 'flex';
    showQuestion();
    startMusic(); // "Let's Begin" click e dhukleই gaan shuru
  }

  function showQuestion() {
    const q = questions[current];
    document.getElementById('q-emoji').src = q.gif;
    // force re-animation
    const el = document.getElementById('q-text');
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = '';
    el.textContent = q.text;

    const pct = (current / questions.length) * 100;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('step-label').textContent = `Question ${current+1} of ${questions.length}`;

    // Reset NO button back to its normal spot in the row
    const noBtn = document.getElementById('btn-no');
    noBtn.classList.remove('roaming');
    noBtn.style.position = '';
    noBtn.style.left = '';
    noBtn.style.top = '';
    noBtn.style.transform = '';

    // Clear the toast for the new question
    const toastEl = document.getElementById('no-msg-toast');
    toastEl.classList.remove('show');
    document.getElementById('no-msg-text').textContent = '';
    document.getElementById('no-msg-gif').src = '';
    dodgeCount = 0;
  }

  function answerYes() {
    spawnConfetti();
    current++;
    if (current >= questions.length) {
      showFinal();
    } else {
      showQuestion();
    }
  }

  // "No" click korle je message গুলো show hobe (Banglish, proposal er jonno)
  const noMessages = [
    "Please ekbar Yes bolo na 🥺",
    "Amake evabe kosto dio na 💔",
    "Tumi chara ar keu nai amar 🥹",
    "Ektu bhebe dekho na please",
    "Amar mon tা bojho please 🥺",
    "Sudhu ekbar Yes bolo 💕",
    "Please please please... Yes bolo",
    "Tumi jano tumi amar sob কিছু 💖",
    "Ekবার try koro Yes e 🌸",
    "Amake fire jete dio na",
    "Tumi amar jonno special 💗",
    "Please na bolo na, Yes bolo",
    "Sudhu tomake e chai ami",
    "Ei prothom evabe request korchi 🥺",
    "Please ektu daya koro amar upor 💕",
    "Tumi ki amay bhalobasho na?",
    "Amar kotha ta shono na please",
    "Yes bolle khub khushi hobo 🥰"
  ];
  let lastMsgIndex = -1;

  // Cute reaction cat gifs — shown alongside the message
  const catGifs = [
    "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExdGVyODg1cHE5OHh4cDlxaWR4OXMxbWtiZWUyZG5hYXk4YmVvZHVqNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/I1nwVpCaB4k36/giphy.gif",
    "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExYWR6N3JncG1sZW1rNjd2ZzZ4NWlsZzJlZDM1NGkxZnlmaWZlcnl0ZyZlcD12MV9naWZzX3JlbGF0ZWQmY3Q9Zw/mrZcf6eYn3bz2/giphy.gif",
    "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExYWR6N3JncG1sZW1rNjd2ZzZ4NWlsZzJlZDM1NGkxZnlmaWZlcnl0ZyZlcD12MV9naWZzX3JlbGF0ZWQmY3Q9Zw/SjUVdtZJD1amvPddOq/giphy.gif",
    "https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyZHEzeHhkd3M3Y3JteHhvNHllY3Z4cWJxaXhpZXV6ZmN4aGRwMDNpMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/zZbf6UpZslp3nvFjIR/giphy.gif"
  ];
  let lastGifIndex = -1;

  function showNoMessage() {
    const toast = document.getElementById('no-msg-toast');
    const textEl = document.getElementById('no-msg-text');
    const gifEl = document.getElementById('no-msg-gif');

    // Pick a message that isn't the same as last time
    let idx;
    do {
      idx = Math.floor(Math.random() * noMessages.length);
    } while (idx === lastMsgIndex && noMessages.length > 1);
    lastMsgIndex = idx;

    // Pick a gif that isn't the same as last time
    let gIdx;
    do {
      gIdx = Math.floor(Math.random() * catGifs.length);
    } while (gIdx === lastGifIndex && catGifs.length > 1);
    lastGifIndex = gIdx;

    toast.classList.remove('show');
    void toast.offsetWidth; // reflow to restart animation
    gifEl.src = catGifs[gIdx];
    textEl.textContent = noMessages[idx];
    toast.classList.add('show');
  }

  let dodgeCount = 0;
  function dodgeNo() {
    dodgeCount++;
    showNoMessage();
    const btn = document.getElementById('btn-no');
    const yesBtn = document.querySelector('.btn-yes');
    const card = document.querySelector('.card');
    const cardRect = card.getBoundingClientRect();
    const yesRect = yesBtn.getBoundingClientRect();

    // Keep the button confined to inside the visible card area
    const btnW = btn.offsetWidth || 110;
    const btnH = btn.offsetHeight || 46;
    const padding = 14;
    const buffer = 20; // extra space to keep away from the Yes button

    const minLeft = cardRect.left + padding;
    const maxLeft = cardRect.right - btnW - padding;
    const minTop = cardRect.top + padding;
    const maxTop = cardRect.bottom - btnH - padding;

    // Try a few random spots and skip any that overlap the Yes button
    let newLeft, newTop, tries = 0;
    do {
      newLeft = minLeft + Math.random() * Math.max(0, maxLeft - minLeft);
      newTop = minTop + Math.random() * Math.max(0, maxTop - minTop);
      tries++;
    } while (
      tries < 15 &&
      newLeft < yesRect.right + buffer &&
      newLeft + btnW > yesRect.left - buffer &&
      newTop < yesRect.bottom + buffer &&
      newTop + btnH > yesRect.top - buffer
    );

    btn.classList.add('roaming');
    btn.style.left = newLeft + 'px';
    btn.style.top = newTop + 'px';

    // Unlimited dodge — jotobar click/hover korবে totobar card er bhitore
    // notun jaygay sorবে (Yes button ke overlap na kore), kintu button
    // kokhonoi hidden/disable hobe na.
    // Sudhu "Yes" e click korলেই next question e jabe.
  }

  // Last page er cute gif — 2 tar moddhe ekbar e ekta random e ashbe
  const finalGifs = [
    "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUycHN4czlqa2oxbGpxYWpnM2Fud2w0NWY2eWY4a292c3phaDB1cGd3ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/A8ReUjJdMCNOM/giphy.gif",
    "https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyN2VncXFiaWZ1cHF2bGtyb2JuNTBhZjJsdW1lc3F0aDNxdTJyNTFjbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/85NbGstFaElEO1Wusd/giphy.gif"
  ];

  function showFinal() {
    document.getElementById('question-screen').style.display = 'none';
    const fs = document.getElementById('final-screen');
    fs.style.display = 'flex';

    // Randomly pick one of the two gifs to show
    const gIdx = Math.floor(Math.random() * finalGifs.length);
    document.getElementById('final-gif').src = finalGifs[gIdx];

    // Big confetti burst
    for (let i = 0; i < 30; i++) {
      setTimeout(() => spawnConfetti(true), i * 80);
    }
    document.getElementById('progress-bar').style.width = '100%';
  }

  function spawnConfetti(big = false) {
    const emojis = ['💗','💕','💖','💝','🌸','✨','💓','🥰'];
    const el = document.createElement('div');
    el.className = 'confetti-heart';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (10 + Math.random() * 80) + 'vw';
    el.style.top = '0';
    el.style.fontSize = big ? (1.5 + Math.random() * 1.5) + 'rem' : '1.2rem';
    el.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
</script>
